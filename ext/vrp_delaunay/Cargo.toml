[package]
name = "vrp_delaunay"
version = "0.1.0"
edition = "2021"
description = "Delaunay triangulation for VRP optimizer - standalone binary using Spade"

[[bin]]
name = "vrp_delaunay"
path = "src/main.rs"

[dependencies]
spade = "2.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
