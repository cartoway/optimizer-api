x-default-service: &default-service
  image: optimizer-api:latest
  environment: &default-environment
    APP_ENV: test
    BUNDLE_WITH: "test development"
    DOCKER: 'true'
    LOG_LEVEL: fatal
    OPTIM_DEFAULT_MAX_LATENESS_RATIO: 1
    OPTIM_GENERATE_GEOJSON_POLYLINES: 'true'
    # REDIS_CACHE_HOST: redis-cache
    REDIS_COUNT_HOST: redis-resque
    REDIS_RESQUE_HOST: redis-resque
    REDIS_RESULT_TTL_DAYS: ${REDIS_RESULT_TTL_DAYS:-1}
  depends_on:
    redis-resque:
      condition: service_healthy
    # - redis-cache

services:
  api:
    <<: *default-service
    ports:
      - "8083:80" # HOST:CONTAINER, edit only HOST part
    command: bundle exec puma -v -p 80 --pidfile 'server.pid'

  resque-default:
    <<: *default-service
    environment:
      <<: *default-environment
      COUNT: 5
      QUEUE: DEFAULT
    command: bundle exec rake resque:workers --trace
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'resque:work' >/dev/null || exit 1"]
      start_interval: 1s
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

  redis-resque:
    image: redis:${REDIS_VERSION:-7-alpine}
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli --raw incr ping
      start_interval: 1s
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

  # redis-cache:
